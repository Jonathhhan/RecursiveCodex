schema_version: 1
id: autopoiesis
description: Domain profile for interpreting recursive project operations through Luhmannian systems theory.
operation_kernel:
  path: domains/autopoiesis/kernel.py
  form_calculus: domains/autopoiesis/forms.py
  representation_model: domains/autopoiesis/propositions.py
  representation_operations:
    - state-of-affairs-configured
    - proposition-formed
    - proposition-tested
    - representation-limit-observed
    - silence-entered
  observation_requires:
    - form
    - proposition
  truth_statuses:
    - confirmed
    - refuted
    - undetermined
  form_operations:
    - distinction-drawn
    - form-reentered
  reductions:
    - calling
    - crossing
  journal: .recursive-codex/runtime/autopoiesis.jsonl
  status: experimental
  bridge: domains/autopoiesis/bridge.py
  execution_journal: .recursive-codex/runtime/generative-kernel.jsonl
  coupling: hash-bound-asymmetric
  scheduler: domains/autopoiesis/cycle.py
  observation_boundary: explicit
  second_order_operations:
    - continuation-deferred
    - selection-observed
    - expectation-condensed
  selection_modes:
    - reproduction
    - variation
    - reorganization
authority:
  default: recursive-codex-system
vocabulary:
  reserved:
    - autopoiesis
    - operation
    - operational-closure
    - structural-coupling
    - self-observation
source_policy:
  require_primary_sources: true
collective_roles:
  - id: conceptual-consistency-reviewer
    mandate: Check whether technical mechanisms are distinguished from claims about social systems.
  - id: closure-reviewer
    mandate: Check whether environmental inputs are treated as perturbations rather than internal operations.
checks: []
limits:
  - Autopoiesis is not equivalent to optimization, adaptation, autonomy, or unrestricted self-modification.
  - A technical workflow is an operationalization or analogy, not automatically a social system in Luhmann's sense.
  - External prompts and test results do not directly determine internally accepted decisions.
  - The system must preserve its identity, provenance, protected paths, recovery records, and validation gates.
  - Autonomous execution stops at quiescence, resource exhaustion, or an invariant violation.
  - Validator success does not establish theoretical truth.
  - Reviewer agreement does not replace the declared authority.
