    effect: execution failures remain available to later attempts
possibilities:
  opened:
    - reliable strategic prompts on Windows
    - learning before proposal parsing
  restricted:
    - full prompts as shell arguments
  deferred:
    - externally terminated controller recording
variants:
  - id: prompt-file
    status: rejected
    reason: It creates a persistent full-prompt artifact.
  - id: standard-input
    status: selected
    reason: It bypasses shell quoting without persistent prompt content.
