schema_version: 1
id: stdin-child-failure-memory
operation: revision
goal: Make strategic prompts Windows-safe and retain child execution failures.
baseline: stabilized event .recursive-codex/events/0022-integrate-generative-kernel.yaml
scope:
  allowed:
    - scripts/run_autonomous.py
    - tests/test_autonomous_transport.py
