changes:
  - component: prompt transport
    effect: sends prompts through standard input rather than a PowerShell argument
  - component: failure memory
    effect: records child timeouts and nonzero exits against selected goals
relations:
  - from: strategic context
    to: child invocation
    effect: JSON-bearing prompts avoid shell argument splitting
  - from: child failure
