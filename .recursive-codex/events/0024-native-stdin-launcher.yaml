changes:
  - component: executable resolution
    effect: uses the platform path resolver and selects codex.CMD instead of preferring codex.ps1 on Windows
  - component: regression test
    effect: locks native path resolution independently of the host platform
relations:
  - from: stdin prompt contract
    to: native launcher
    effect: structured prompts reach codex exec without PowerShell shim argument processing
  - from: child exit failure
    to: generative journal
    effect: the observed launcher failure remains available to later selection
possibilities:
  opened:
    - end-to-end autonomous stdin execution on Windows
  restricted:
    - automatic preference for PowerShell npm shims
  deferred:
    - launcher capability probing
variants:
  - id: powershell-shim
    status: rejected
    reason: It failed the stabilized stdin invocation contract in the observed runtime.
  - id: native-path-match
    status: selected
    reason: It delegates executable selection to the platform resolver and preserves an argument vector.
collective_findings: []
authority:
  required: true
  status: accepted
  reference: .recursive-codex/decisions/0024-native-stdin-launcher.yaml
validation:
  - check: python -m unittest discover -s tests -q
    result: passed 63 tests
  - check: python scripts/validate_project.py .
    result: passed
  - check: python scripts/validate_change_event.py templates/change-event.yaml
    result: passed
  - check: python scripts/validate_change_event.py .recursive-codex/events/0024-native-stdin-launcher.yaml
    result: passed
recovery:
