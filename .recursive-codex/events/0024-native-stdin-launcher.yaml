schema_version: 1
id: native-stdin-launcher
operation: revision
goal: Make the stabilized stdin prompt contract executable through the Windows Codex launcher.
baseline: stabilized event .recursive-codex/events/0023-stdin-child-failure-memory.yaml
scope:
  allowed:
    - scripts/run_autonomous.py
    - tests/test_autonomous.py
    - .recursive-codex/decisions/0024-native-stdin-launcher.yaml
    - .recursive-codex/events/0024-native-stdin-launcher.yaml
  protected:
    - .recursive-codex/project.yaml
    - docs/GENEALOGY.md
provenance:
