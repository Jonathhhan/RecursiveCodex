id: decision-separate-autopoietic-operation-layer
date: 2026-07-31
status: accepted
authority: recursive-codex-system
decision: Separate the domain-neutral safety controller from an experimental autopoietic operation layer that transforms perturbations into observations, tensions, and internally derived connection goals.
alternatives:
  - id: rename-controller-autopoietic
    assessment: Rejected because terminology alone would conceal the controller's externally supplied goals.
  - id: embed-luhmannian-semantics-in-core
    assessment: Rejected because it would violate the translation boundary and universalize one domain.
  - id: domain-operation-layer
    assessment: Selected because it restores theoretical experimentation without weakening general governance.
criteria:
  - theoretical traceability
  - domain neutrality
  - operational closure
  - deterministic reproduction
limits:
  - The layer is a technical operationalization, not proof of a Luhmannian social system.
  - Automatic transfer into controller authority remains deferred to an audited bridge.
event: .recursive-codex/events/0034-separate-autopoietic-operation-layer.yaml
