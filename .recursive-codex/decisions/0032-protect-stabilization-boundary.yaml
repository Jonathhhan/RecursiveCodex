id: decision-protect-stabilization-boundary
date: 2026-07-31
status: accepted
authority: recursive-codex-system
decision: Treat validation outputs as discarded ephemeral state, prohibit overlap with trust anchors, preserve stabilized record bytes across checks, and derive a parent-enforced minimum risk from patch content.
alternatives:
  - id: retain-allowed-outputs
    assessment: Rejected because an excluded path could conceal mutation of the event being promoted.
  - id: ephemeral-outputs-with-byte-invariants
    assessment: Selected because it makes discard semantics explicit and independently protects promoted records.
criteria:
  - authority integrity
  - provenance integrity
  - fail-closed validation
  - autonomous risk containment
limits:
  - Declared checks can still cause external side effects beyond the copied filesystem.
  - Critical changes continue to require external authority.
event: .recursive-codex/events/0032-protect-stabilization-boundary.yaml
