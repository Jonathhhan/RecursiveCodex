schema_version: 1
project: RecursiveCodex
domain: neutral
authority:
  final_decision: repository-owner
paths:
  events: .recursive-codex/events
  decisions: .recursive-codex/decisions
  protected:
    - docs/GENEALOGY.md
checks:
  - python -m unittest discover -s tests -v
  - python scripts/validate_project.py .
  - python scripts/validate_change_event.py templates/change-event.yaml
