schema_version: 3
project: RecursiveCodex
domain: autopoiesis
authority:
  final_decision: recursive-codex-system
paths:
  events: .recursive-codex/events
  decisions: .recursive-codex/decisions
  protected:
    - docs/GENEALOGY.md
    - .recursive-codex/domain.yaml
    - scripts/run_autonomous.py
    - scripts/validate_project.py
    - schemas/project.schema.json
checks:
  - id: unit-tests
    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
    ephemeral_outputs: []
  - id: project-validator
    command:
      - python
      - scripts/validate_project.py
      - .
    ephemeral_outputs: []
  - id: event-template-validator
    command:
      - python
      - scripts/validate_change_event.py
      - templates/change-event.yaml
    ephemeral_outputs: []
