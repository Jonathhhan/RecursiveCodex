name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository project
        run: python scripts/validate_project.py .
      - name: Validate example project
        run: python scripts/validate_project.py examples/minimal-project
      - name: Validate template event
        run: python scripts/validate_change_event.py templates/change-event.yaml
